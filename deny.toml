# cargo-deny: what the dependency tree may contain (`cargo xtask deny`, and the `deny` job in
# .github/workflows/ci.yml). https://embarkstudios.github.io/cargo-deny/
#
# - advisories: a RustSec vulnerability fails the build; an unmaintained or yanked crate warns.
#   An ignored advisory carries the reason and the date it was looked at.
# - licenses: OSI-approved permissive licences only. No GPL, LGPL or AGPL, ever (clean room,
#   CLAUDE.md): a crate offered under "X OR GPL" is taken under X. The one non-OSI licence the
#   tree needs is allowed for exactly the crate that needs it.
# - bans: two versions of one crate warn (the GUI stack brings some).
# - sources: crates.io, and git from storytold/craft-libs alone (pinned by `rev` in Cargo.toml).

[graph]
all-features = true

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "warn"
ignore = [
    # 2026-10-17: zbus_names, zvariant and zvariant_derive are unmaintained as standalone crates
    # (merged into zbus 6). They come only through eframe → egui-winit → accesskit_winit →
    # accesskit_unix → zbus 5 (Linux screen-reader support); no vulnerability. Drop these once
    # accesskit moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "unmaintained, via eframe's accesskit_unix (zbus 5); no fix upstream yet" },
    { id = "RUSTSEC-2026-0371", reason = "unmaintained, via eframe's accesskit_unix (zbus 5); no fix upstream yet" },
    { id = "RUSTSEC-2026-0372", reason = "unmaintained, via eframe's accesskit_unix (zbus 5); no fix upstream yet" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[[licenses.exceptions]]
# egui's built-in fonts (Ubuntu Light among them): the Ubuntu Font Licence permits redistribution;
# not OSI, used for this crate alone.
name = "epaint_default_fonts"
allow = ["Ubuntu-font-1.0"]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Workspace crates name each other by path alone; every crates.io dependency has a version.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/storytold/craft-libs"]
