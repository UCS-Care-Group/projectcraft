[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/UCS-Care-Group/projectcraft"

[workspace.dependencies]
# internal
projectcraft-time = { path = "crates/time" }
projectcraft-model = { path = "crates/model" }
projectcraft-engine = { path = "crates/engine" }
projectcraft-ui-egui = { path = "crates/ui-egui" }

# foundation
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"

# ui
egui = "0.36"
eframe = { version = "0.36", default-features = false }
# Headless screenshots (ui-egui's `ui_shot` example), as MailCraft and WordCraft. Dev-only.
egui_kittest = "0.36"
# native Open / Save As dialogs; the desktop app only (layers forbid it below L6)
rfd = "0.17"

# craft-libs (storytold/craft-libs): shared crates of the Craft suite, a git dependency pinned by
# `rev`; deny.toml allows that one repository.
# Crash-safe atomic file replacement; the engine's saves, native only.
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "8f5a2831614e632f91ad367f7af2a6e5b61b9529" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
debug = 0
