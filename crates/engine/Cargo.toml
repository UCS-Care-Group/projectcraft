[package]
name = "projectcraft-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProjectCraft engine: session, undo, the command registry (every action is a command), the sample project, file I/O"

[lints]
workspace = true

[dependencies]
projectcraft-time = { workspace = true }
projectcraft-model = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# Atomic saves (staging beside the file, fsync, rename, owner-only staging). The web build saves
# no files.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
