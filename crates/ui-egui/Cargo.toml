[package]
name = "projectcraft-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ProjectCraft front end on egui: the Gantt Chart view (task sheet and bars)"

[lints]
workspace = true

[dependencies]
projectcraft-engine = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The `ui_shot` example renders the window offscreen (wgpu) to PNG, as MailCraft and WordCraft.
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
